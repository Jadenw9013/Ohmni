      "affected_files": ["src/ohmni/application/visuals.py", "src/ohmni/application/demo.py", "apps/web/app.js"],
      "found_at_commit": "ff4309a",
      "resolution_commit": null,
      "resolution": null,
      "verification": "Code inspection of schematic_svg(): component rectangles and separately positioned net circles are emitted with no edges/pins/connections; only the artifact fingerprint is consumed. tests/test_demo_projection.py asserts SVG presence/fingerprint, not topology equivalence.",
      "recommended_correction": "Render from the exact compiled schematic artifact or a compiler-owned structured geometry/topology projection with lineage, label abstraction honestly, and test all components/nets/connections against the downloadable artifact."
