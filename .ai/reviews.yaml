      "found_at_commit": "ff4309a",
      "resolution_commit": null,
      "resolution": null,
      "verification": "Live job ef3d8dd1d379: mutate golden.kicad_sch; artifact GET returned 409 while /api/jobs report retained schematic.current=true. Code inspection: artifact_is_current() reads bytes at line 41 and do_GET() separately reads response bytes at line 67.",
      "recommended_correction": "Revalidate freshness when projecting/serving job state and read artifact bytes once, hash those exact bytes, then serve that same immutable buffer; add HTTP-level stale, race, missing, and alternate-path tests."
    },
