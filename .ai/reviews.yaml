      "description": "After an artifact changes, the download route returns 409 but the completed job report still returns current=true, so a refreshed UI labels the stale artifact CURRENT. The handler also hashes the path and then reads it again for the response, leaving a check/use gap in which served bytes need not match the verified fingerprint.",
