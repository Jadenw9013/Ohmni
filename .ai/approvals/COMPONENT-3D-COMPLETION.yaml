n the spec's numbers and the generated geometry go in the verification report with the geometry choice used. Do not silently adjust.\n\nVisuals\nPer group, produce a contact sheet of all its components at LOD1. For the hardest parts, produce the full view set (top, underside, side, three-quarter) at LOD1: USB-C, RJ45, 16x2 LCD, SD socket, pluggable terminal block, flyback transformer and 2x5 pin header.\n\nFinal integration pass, after Group E\n1. Add a registry-completeness test that asserts all 180 OHM-IDs (001..180) resolve to a generator and a package-family member, with no duplicates and no extras, and that each has LOD0, LOD1 and LOD2.\n2. Produce one full contact sheet of all 180 at LOD1 and a coverage table: entry, family, generator, LOD support, source status, provisional yes/no.\n3. Run the full frontend, Python and lint gates and the source-import checks.\n4. Check that an implementation flag exists for every entry whose source status was partial, and that no entry that was partial is now labeled complete.\n5. Write a short README for the library covering the directory layout, how to add a component from a data record, how LOD and materials work, and the board-side and viewer adapters.\n\nFinal report\nList the commits, the test results, the total entry count, every provisional entry with its uncertain values, all spec conflicts, all added material tokens, and any entries where you had to stop or deviate. Then stop for my review of the whole library.",
