n targeted checks during implementation and the required full gates at\nthe integration boundary. Do not rerun expensive routing after every\nmaterial adjustment.\n\n## 10. Execution and review discipline\n\nUse the existing task ledger instead of creating a parallel workflow.\n\nProceed through approved tasks without stopping at every substep.\nKeep coherent commits and durable recovery checkpoints.\n\nUse one focused independent final review covering:\n- Source/visual truth separation\n- Artifact integrity\n- Component/model mapping\n- Browser interaction\n- Regression risks\n- The supplied visual acceptance requirements\n\nDo not launch repeated broad historical review panels.\nTarget re-review only to concrete fixes.\n\nDo not claim that automated tests or an agent's visual score replace my\nfinal visual acceptance. Finish implementation and available verification,\nthen provide the screenshots for my comparison.\n\nDo not push, deploy, purchase assets, or start paid services without\nseparate authorization.\n\n## 11. Final handoff\n\nReport:\n\n- What changed in the actual board viewer\n- What was built in the dense reference explorer\n- Renderer and model pipeline selected\n- Inventory coverage and unresolved details\n- Asset licensing/provenance\n- Source circuit/PCB hash comparison\n- Tests and independent review actually performed\n- Measured performance\n- Before/after and macro screenshot paths\n- Exact Windows startup command\n- Exact local route/button for each output\n- Commit hashes and working-tree status\n- Any remaining human visual acceptance step\n\nDo not report \u201calmost identical\u201d without rendered comparison evidence.\nDo not report added real electrical complexity when only the sample changed.\n\nBEGIN NOW:\n\nInspect repository state and the extracted package, map VIS-REF-001 into\nthe approved workflow, and implement the five-object rendering proof.\nThen continue through the asset library, both integrated viewers,\ninteractions, and final acceptance checks.",
