d scope\n\nRecord this instruction as human approval for VIS-REF-001 using the repository's existing governance mechanism.\n\nApproved implementation:\nWork packages W0\u2013W7 from the supplied plan.\n\nApproved planning only:\nW8, the optional proposal for a genuinely richer electrical demonstrator.\n\nThis does NOT approve unrelated product milestones, live model integration, cloud deployment, purchasing, or changes to the real board's electrical design.\n\nAutomatically remediate concrete findings within this visual scope without asking for permission after every task.\n\n## 3. Deliver BOTH outputs\n\nOUTPUT A: THE ACTUAL OHMNI BOARD\n\nSubstantially improve the rendering of the existing real board.\n\nPreserve:\n- Component identities and counts\n- Footprint and pad mappings\n- Component positions and orientations\n- Board outline\n- Nets, traces, vias, and existing layers\n- Electrical verification behavior\n- Artifact integrity and lineage\n\nUpgrade its component models, materials, lighting, shadows, camera,\nselection, and educational inspection.\n\nDo not place extra ICs, capacitors, mounting holes, ground pours,\nor decorative traces into this authenticated board view.\n\nOUTPUT B: DENSE REFERENCE-INSPIRED COMPONENT EXPLORER\n\nCreate the separate educational scene specified in the plan.\n\nIt should match the reference's:\n- Component-family variety\n- Dense regional composition\n- Large/medium/small package distribution\n- Height variation\n- Colored passive banks\n- Connector interiors\n- Individual metal leads and contacts\n- Capacitor rims and sleeves\n- Coil detail\n- Solder, pads, markings, and board thickness\n\nKeep this label persistently visible:\n\n\u201cReference-inspired educational model \u00b7 not an electrically verified design\u201d\n\nThe sample must never inherit the real project's PASS badges,\nprices, fabrication readiness, manufacturing exports, or connectivity claims.\n\nBoth outputs must be reachable through the actual Ohmni interface.\nDo not deliver only an isolated developer test page.\n\n## 4. Build a real 3D rendering pipeline\n\nFollow the renderer direction in the supplied plan.\n\nPrefer a pinned Three.js integration into the current frontend,\nor reuse an existing equivalent GPU renderer if the repository now has one.\n\nDo not rewrite the entire application in React merely to install a viewer.\nDo not build another bespoke software rasterizer.\n\nA small documented build step or local versioned modules are allowed.\n\u201cNo build step currently exists\u201d is not sufficient justification to avoid\nthe rendering quality requested.\n\nInspect the installed KiCad export capabilities.\nPerform the bounded GLB/model-identity spike in the plan.\n\nChoose exported geometry, procedural artifact-derived geometry,\nor a hybrid according to actual model availability and selection fidelity.\n\nDo not assume exported models contain missing component geometry.\nPreserve a stable mapping from selectable objects to source components.\n\nServe runtime assets locally so the deterministic demo remains usable offline.\nPreserve the existing hashed asset/server-instance protections.\nKeep the current 2D view as a functional fallback.\n\n## 5. First visible implementation checkpoint\n\nBuild the plan's five-object quality proof early:\n\n1. Green board slab with actual through-holes\n2. Leaded IC with individually shaped metal feet\n3. Connector with a recessed interior and separate contacts\n4. Aluminum capacitor can with rim and base\n5. Blue axial resistor with bands and bent leads\n\nUse the intended final lighting and material pipeline.\n\nProve in the browser that:\n- The camera orbits\n- Objects can be selected\n- Metal and plastic look different\n- Connector cavities have depth\n- Holes remain openings at grazing angles\n- Contact shadows anchor components\n\nCapture a real screenshot.\n\nThen continue into the full implementation. This is an internal checkpoint,\nnot a request for another approval before you can proceed.\n\n## 6. Complete the inventory, not only the large objects\n\nUse REFERENCE_INVENTORY.json as the coverage source.\n\nCreate/update VISUAL_COVERAGE.md with a disposition for every inventory ID:\n\n- Implemented component\n- Implemented subpart of a named parent\n- Board/rendering feature\n- Unresolved feature with an explicitly approximate representation\n- Viewport-only feature with its implementation/disposition documented\n\nThe inventory has 158 entries, not 158 confirmed electrical components.\n\nDo not count resistor bands, leads, solder fillets, or terminal caps as\nadditional BOM parts.\n\nImplement all required asset families in section 4 of the plan.\nDo not stop after adding a central chip, several headers, and cylinders.\n\nGive each family a preview and close-up.\nUncertain reference objects must remain uncertain in labels and explanations.\n\nPreserve asset source, license, hashes, dimensions or approximation status,\nmaterial slots, and selection ownership.\n\nDo not publish the supplied reference image or third-party assets unless\nredistribution rights are established. Keep private reference material\noutside publicly served or committed assets when necessary.\n\n## 7. Match the material and composition specification\n\nUse the supplied palette and material ranges as starting art direction.\n\nImportant distinctions include:\n- Green dielectric solder mask versus metallic pads\n- Charcoal resin versus black connector plastic\n- Off-white connector housings versus aluminum shells\n- Navy sleeves versus exposed silver capacitor tops\n- Blue/beige/red/orange coated parts\n- Warm gold contacts\n- Olive-brown board edges\n- Off-white silkscreen\n\nDo not use one flat material for compound components.\n\nFollow the plan's lighting, camera, scene-density, and framing requirements.\nAvoid bloom, glowing traces, floating copper pipes, and excessive darkness.\n\nReference image coordinates locate features in a picture.\nThey are