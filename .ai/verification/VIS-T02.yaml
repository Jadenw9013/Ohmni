        {
          "rule_id": "PB-PIN-002",
          "severity": "info",
          "title": "U1 leaves 5 strapping pins on their internal defaults",
          "description": "ESP32-WROOM-32E boot configuration is set by IO0 (internal pull-up, on net 'IO0'), IO12 (internal pull-down, unconnected), IO15 (internal pull-up, unconnected), IO2 (internal pull-down, unconnected), IO5 (internal pull-up, unconnected). Relying on the internal pulls is normal and gives the documented default boot mode, but it is worth knowing which pins these are: anything you attach to one of them -- an LED, a bus, a header -- is also pulling on it while the part boots. Add an external resistor wherever you need a level the internal pull does not give you.",
          "affected_components": [
            "U1"
          ],
          "affected_nets": [],
          "evidence": [],
          "auto_fixable": false,
          "suggested_fix": null,
          "lesson_topic": "strapping-pins",
          "finding_id": "8e9d8c943c75"
        },
        {
          "rule_id": "PB-UART-001",
          "severity": "info",
          "title": "UART pin orientation on 'UART_TX' needs human confirmation",
          "description": "U1.35 (TXD0) goes to a connector pin (J2.3 (P3)) rather than to another UART device, so the correct wiring depends on how that header is labelled. Both conventions exist in shipping products: a header labelled from the board's point of view wants TX on the pin marked TX, one labelled from the programmer's point of view wants the opposite. This cannot be settled from the netlist. Confirm against the programmer you intend to use.",
          "affected_components": [
            "J2",
            "U1"
          ],
          "affected_nets": [
            "UART_TX"
          ],
          "evidence": [],
          "auto_fixable": false,
          "suggested_fix": null,
          "lesson_topic": "uart-header-conventions",
          "finding_id": "f80a2f7d5c4d"
        }
      ],
