          "description": "The project asks for hand-solderable parts, but U3 (BME280) is in a LGA-8 package. 2.5 x 2.5 x 0.93 mm LGA. Bottom-terminated: needs hot air or reflow. A hobbyist with an iron should use a breakout module instead. The design is electrically fine; this is an assembly constraint.",
