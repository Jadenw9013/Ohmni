    "The browser submits one fixed fixture identifier; the server maps both that identifier and the exact legacy displayed request to its own canonical DEMO_REQUEST and rejects all other envelopes.",
    "Static UI assets, APIs, and artifact downloads all carry Cache-Control: no-store.",
    "The real exported frontend start path and live server ownership/contracts have regression coverage; verification and artifact-integrity code was not weakened."
  ],
