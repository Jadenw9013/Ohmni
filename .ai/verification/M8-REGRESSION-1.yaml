  "root_cause": "On Windows, ThreadingHTTPServer inherited address reuse and allowed a second live demo process to claim the same endpoint with an independent in-memory JobStore. A browser could therefore retain or receive a UI from one process while its start/status API owner disappeared or changed; cacheable static responses prolonged that stale client/server combination.",
