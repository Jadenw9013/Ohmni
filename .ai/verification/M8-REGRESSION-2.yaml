  "root_cause": "A retained browser page could keep presenting a completed job from a demo-server process that had exited or restarted. Static assets, API envelopes, and the in-memory JobStore had no shared identity, so a new server generation could serve a page bound to a vanished one, and every client-visible failure collapsed into a single blanket error.",
  "remediation": [
    "Every demo-server process generates a distinct random 16-hex instance identity and owns an isolated JobStore; job polling is generation-bound so a restarted server cannot adopt an old job identifier.",
    "The four executable UI assets are read once into an immutable startup snapshot whose SHA-256 becomes the ui_version carried through health, job creation, polling, and response headers.",
    "Clients bind job creation to the exact API version, server instance, and UI snapshot; the exact fixed-fixture and canonical-request payloads remain narrowly supported for pre-versioned local clients.",
    "Backend-unavailable, API/UI contract mismatch, server-generation mismatch, fixture rejection, worker-start failure, lost job, and pipeline failure now have distinct fixed frontend guidance instead of one blanket message.",
    "Server diagnostics are allowlisted structured JSON events on stderr containing no request bodies, exception strings, tracebacks, or filesystem paths; initialization, bind, worker-launch, pipeline, and runtime failures stay distinct boundaries.",
    "A completed workspace polls health and invalidates itself when the server identity changes or disappears, so a stale completed run cannot look current.",
    "Coverage added for the real exported form path, Windows subprocess lifecycle and endpoint ownership, restart/stale-job behaviour, the asset snapshot, and a real headless-browser click."
  ],
