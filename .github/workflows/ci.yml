name: repository-gates

on:
  pull_request:
  push:

jobs:
  # Fresh teammate setup, without browser downloads, native tools or agent startup.
  # Full history is needed by the existing development-ledger validation.
  hackathon-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/setup_hackathon.py --skip-browser
      - run: .venv/bin/python -m pytest tests/test_hackathon_setup.py

  fetch-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,fetch]"
      # Real pinned SDK construction and loopback gateway tests; no model,
      # account credentials, Agentverse registration or native EDA invocation.
      - run: python -m pytest -q tests/test_fetch_agent.py tests/test_fetch_bridge.py tests/test_fetch_workspace.py

  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/ai_state.py validate
      - run: python scripts/verify.py fast
      # Offline telemetry fault scenarios against the in-memory recording transport.
      - run: python scripts/telemetry_fault_harness.py

  # A separate, required evidence gate. `fast` runs offline and skips every
  # source-dependent test when the pinned manufacturer PDFs are absent, so a
  # green `fast` run must never be mistaken for "the source checks ran against
  # the real document". This job acquires the pinned sources and fails if they
  # cannot be obtained or no longer match their digests.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/acquire_corpus.py
      - run: python scripts/record_component_extraction.py --check
      - run: python scripts/verify.py corpus

  # The browser modules' own Node test suite. The file list is enumerated and
  # must be non-empty, so a glob that matches nothing cannot pass as "0 failed".
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test apps/web/tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/web/tests -maxdepth 1 -name '*.test.mjs' | sort)
          test "${#files[@]}" -gt 0
          echo "running ${#files[@]} test files"
          node --test --test-reporter=tap "${files[@]}" 2>&1 | tee build-node-tests.log
          grep -Eq '^# fail 0$' build-node-tests.log
          grep -Eq '^# pass [1-9][0-9]*$' build-node-tests.log
      # The committed browser telemetry bundle must rebuild byte-for-byte from
      # its pinned source and lockfile (build-time only; Vercel stays no-build).
      - name: telemetry bundle reproducibility
        run: |
          npm ci --prefix scripts/telemetry-browser --no-audit --no-fund
          node scripts/telemetry-browser/build.mjs --check

  # Real-browser acceptance: the saved demo under offline, site and static
  # hosting (original, fault, restore, keyboard, recovery, verified downloads,
  # desktop and 390/375/320 px layouts) and the six browser telemetry scenarios.
  # Dependencies come from the network; the checks themselves deny every
  # non-loopback request and use synthetic telemetry with recording transports.
  # The runner fails on a missing browser, BLOCKED or skipped scenario, missing
  # step or zero count, and kills each child's process group when it ends.
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m pip install -e ".[fetch]"
      - name: install the Chromium build matching the pinned Playwright
        run: python -m playwright install --with-deps chromium
      - name: real-browser acceptance
        run: python scripts/run_browser_acceptance.py --output build/browser-acceptance
      - name: Fetch workspace browser acceptance
        run: OHMNI_REQUIRE_BROWSER=1 python -m pytest -q tests/test_fetch_workspace_browser.py
      - name: no browser or server process outlives the checks
        if: always()
        shell: bash
        run: |
          leftover=$(pgrep -fa 'chrome-linux|headless_shell|browser_check_offline_demo|smoke_browser_telemetry' || true)
          if [ -n "$leftover" ]; then
            echo "leftover processes:"; echo "$leftover"
            pkill -9 -f 'chrome-linux|headless_shell|browser_check_offline_demo|smoke_browser_telemetry' || true
            exit 1
          fi
          echo "no leftover browser or server processes"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-summary
          path: |
            build/browser-acceptance/summary.json
            build/browser-acceptance/saved-demo-*/browser-check.json
            build/browser-acceptance/telemetry-smoke/summary.json
            build/browser-acceptance/*.log
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-failure-screenshots
          path: build/browser-acceptance/saved-demo-*/*.png
          if-no-files-found: ignore

  # A bounded real-tool gate for the hackathon board. It runs inside the pinned
  # production KiCad image: real ERC, routing, DRC, Gerber/drill export and the
  # known-bad diagnostic copy, which must produce a real DRC unconnected item.
  # The harness exits 2 (BLOCKED) without the pinned kicad-cli, and the first
  # step proves that on this runner, which has no KiCad, it cannot report green.
  kicad-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: missing kicad-cli must block, not pass
        shell: bash
        run: |
          set +e
          python scripts/verify_hackathon_demo.py --attempts 1 --output-root build/ci-no-kicad
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"status": "BLOCKED"' build/ci-no-kicad/*/summary.json
      - name: real KiCad 10.0.5 harness with fault
        run: scripts/run_in_kicad_image.sh python3 scripts/verify_hackathon_demo.py --attempts 1 --output-root build/ci-hackathon
      - name: require the expected checks in the summary
        shell: bash
        run: |
          python - <<'PY'
          import glob, json
          [path] = glob.glob("build/ci-hackathon/*/summary.json")
          summary = json.load(open(path))
          assert summary["status"] == "PASS", summary["status"]
          assert summary["tools"]["kicad_cli"] == "10.0.5", summary["tools"]
          [attempt] = summary["attempts"]
          assert attempt["status"] == "PASS" and not attempt["missing_required_checks"]
          assert attempt["fault"]["fault_detected"] is True
          assert attempt["fault"]["drc"]["unconnected_count"] >= 1
          print("kicad-gate:", len(attempt["checks"]), "checks passed in", attempt["total_seconds"], "s")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackathon-kicad-gate-summary
          path: |
            build/ci-hackathon/*/summary.json
            build/ci-hackathon/*/attempt-1/fault/diagnostic-result.json
            build/ci-no-kicad/*/summary.json
          if-no-files-found: warn
