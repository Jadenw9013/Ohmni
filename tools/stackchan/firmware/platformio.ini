; Ohmni Stack-chan USB firmware for the M5Stack StackChan (CoreS3 + feedback-servo base).
; Build:  pio run          Flash:  pio run -t upload --upload-port /dev/cu.usbmodemXXXX

[env:stackchan]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
; Same layout as the factory firmware so its NVS (servo calibration) is kept.
board_build.partitions = partitions.csv
board_upload.offset_address = 0x20000
extra_scripts = post:factory_layout.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    bblanchon/ArduinoJson@7.4.2
