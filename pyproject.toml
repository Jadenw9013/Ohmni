[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmni"
version = "0.1.0"
description = "Evidence-first AI electronics engineering mentor"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ohmni = ["catalog/data/parts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration and not slow_integration'"
markers = [
    "kicad: tests requiring an installed KiCad CLI",
    "integration: bounded external-tool integration tests",
    "slow_integration: full golden routing/fabrication integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
