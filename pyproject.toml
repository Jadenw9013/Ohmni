[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmni"
version = "0.1.0"
description = "Evidence-first AI electronics engineering mentor"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
# The telemetry suites run the real pinned SDK, so dev includes it; a missing
# SDK fails those suites instead of skipping them.
dev = ["pytest>=8.0", "ruff>=0.11", "PyYAML>=6.0", "sentry-sdk==2.72.0"]
mcp = ["mcp==2.2.0"]
# Optional error/trace telemetry. Pinned: src/ohmni/adapters/telemetry.py
# refuses any other version. Installed but disabled unless explicitly enabled.
telemetry = ["sentry-sdk==2.72.0"]
# Real-browser acceptance (scripts/run_browser_acceptance.py). The CI browser
# job installs the Chromium build this exact Playwright release expects.
browser = ["playwright==1.56.0"]

[project.scripts]
ohmni-mcp = "ohmni.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ohmni = [
    "catalog/data/parts/*.json",
    "catalog/data/synthesis/*.json",
    "behavior/reference-circuits.json",
    "behavior/data/*.json",
    "behavior/data/classes/*.json",
    "behavior/data/entries/*.json",
    "behavior/data/bindings/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration and not slow_integration'"
markers = [
    "kicad: tests requiring an installed KiCad CLI",
    "integration: bounded external-tool integration tests",
    "simulation_integration: tests requiring the version-gated ngspice 42 executable",
    "slow_integration: full golden routing/fabrication integration tests",
    "corpus: tests needing the pinned manufacturer source corpus (scripts/acquire_corpus.py)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
